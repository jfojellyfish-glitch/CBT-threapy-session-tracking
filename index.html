<!DOCTYPE html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" type="image/png" href="./icon-192.png"><meta name="theme-color" content="#e9ede4"><meta name="apple-mobile-web-app-capable" content="yes"><title>Fieldnotes — Daily Practice</title><style>
:root{
  --bg:#ece7de;
  --paper:#f5f1ea;
  --card:#fbf8f3;
  --card-2:#f1ebe3;
  --ink:#2d312d;
  --muted:#7a7b76;
  --line:#d9d1c7;
  --accent:#6f7a68;
  --accent-deep:#5a6554;
  --sage:#dbe0d3;
  --taupe:#ded1c3;
  --mauve:#d4ced8;
  --sand:#ece2d5;
  --white:#fffdfa;
  --shadow:0 16px 40px rgba(91,88,78,.08);
  --radius:26px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,.5), transparent 32%),
    linear-gradient(180deg,#ede7de 0%,#e8e2d8 100%);
  color:var(--ink);
  font:15px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button,input,textarea,select{font:inherit}
button,a,input,textarea,select{outline-offset:4px}
a{color:var(--accent-deep);text-decoration:none}
a:hover{text-decoration:underline}
button{
  cursor:pointer;
  color:inherit;
  border:1px solid var(--line);
  background:rgba(255,255,255,.72);
  padding:10px 16px;
  border-radius:18px;
  transition:all .18s ease;
}
button:hover{background:var(--white);transform:translateY(-1px)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 10px 24px rgba(111,122,104,.22)}
button.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent)}
.shell{max-width:1380px;margin:auto;padding:28px 28px 72px}
header{
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:22px 24px;
  border:1px solid rgba(255,255,255,.45);
  background:rgba(251,248,243,.84);
  backdrop-filter:blur(10px);
  border-radius:28px;
  box-shadow:var(--shadow);
}
.logo{font:italic 31px Georgia,serif;letter-spacing:-1.6px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.layout{display:grid;grid-template-columns:250px 1fr;gap:26px;padding-top:24px;align-items:start}
aside{
  position:sticky;top:18px;
  padding:18px;
  border-radius:30px;
  background:linear-gradient(180deg,#d7dbd1 0%, #c8cec1 100%);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:var(--shadow);
  color:var(--ink);
}
nav{display:flex;flex-direction:column;gap:6px;padding-bottom:12px}
nav button{
  border:0;background:transparent;text-align:left;padding:11px 13px;color:#4b534b;
  border-radius:16px;
  display:flex;align-items:center;gap:2px;
}
nav button:hover{background:rgba(255,255,255,.42);transform:none}
nav button.active{background:rgba(255,253,250,.92);color:#31362f;font-weight:600;box-shadow:0 8px 20px rgba(91,88,78,.08)}
nav small{color:#899183;margin-right:8px;min-width:24px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:normal;line-height:1.16;margin:0 0 12px;color:#2e312d}
h1{font-size:clamp(38px,5vw,62px);letter-spacing:-2.2px}
h2{font-size:30px;letter-spacing:-.7px}
h3{font-size:22px;letter-spacing:-.4px}
p{margin:0 0 14px}.muted{color:var(--muted);font-size:13px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.panel{
  border:1px solid rgba(255,255,255,.52);
  background:linear-gradient(180deg,rgba(255,253,250,.95),rgba(248,243,237,.95));
  padding:26px;
  margin:0 0 18px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.panel h2{margin-bottom:8px}
.hero{padding:8px 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{
  display:block;width:100%;text-align:left;padding:20px;min-height:136px;white-space:normal;
  background:linear-gradient(180deg,var(--card) 0%,#f2ece5 100%);
  border-radius:22px;border:1px solid rgba(255,255,255,.55);box-shadow:var(--shadow)
}
.tile strong{display:block;font:23px Georgia,serif;margin:7px 0 6px}
.tile span{display:block;color:var(--muted);font-size:13px}
label{display:block;font-weight:600;margin:14px 0 6px;color:#3b413c}
textarea,input[type=text],input[type=date],select{
  border:1px solid var(--line);background:rgba(255,255,255,.8);color:var(--ink);border-radius:16px;padding:12px 14px;width:100%;max-width:100%
}
textarea{min-height:96px;resize:vertical}
input[type=date]{width:auto}
input[type=range]{accent-color:var(--accent);width:100%}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}
.status{font-size:12px;color:var(--muted)}
.score{font-variant-numeric:tabular-nums;color:var(--accent-deep)}
.rule{border-top:1px solid var(--line);margin:24px 0}
.breath{margin:18px auto;width:min(100%,430px);height:220px;border:2px solid var(--line);background:linear-gradient(180deg,#f7f3ed,#f1ebe3);border-radius:28px;display:grid;place-items:center;text-align:center;position:relative;box-shadow:var(--shadow)}
.breath[data-step="0"]{border-left:8px solid var(--accent)}
.breath[data-step="1"]{border-top:8px solid var(--accent)}
.breath[data-step="2"]{border-right:8px solid var(--accent)}
.breath[data-step="3"]{border-bottom:8px solid var(--accent)}
.breath strong{font:36px Georgia,serif}
.history{width:100%;border-collapse:collapse}
.history th,.history td{border-bottom:1px solid var(--line);padding:12px 8px;text-align:left;vertical-align:top}
.note{padding:15px 17px;background:var(--sage);border-left:4px solid var(--accent);font-size:13px;border-radius:18px}
.help{background:rgba(255,253,250,.46);border-top:0;padding:14px 14px 0;margin-top:22px;color:#636a62;border-radius:18px}
.help a{color:var(--accent-deep)}
.check{display:flex;align-items:center;gap:8px;font-weight:normal}.check input{accent-color:var(--accent)}
#printReport{display:none}.danger{color:#8b4a42}.empty{padding:14px 0;color:var(--muted)}.scoreline{display:flex;gap:10px;align-items:center}.scoreline select{width:110px}
.mobileOnly{display:none}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:10px 0 4px}
.metric{padding:18px 18px 16px;border:1px solid rgba(255,255,255,.45);border-radius:24px;box-shadow:var(--shadow);background:linear-gradient(180deg,var(--card),#f1ebe3)}
.metric:nth-child(1){background:linear-gradient(180deg,var(--sage),#edf0e8)}
.metric:nth-child(2){background:linear-gradient(180deg,var(--taupe),#f2eae1)}
.metric:nth-child(3){background:linear-gradient(180deg,var(--mauve),#eeebf2)}
.metric strong{font:34px Georgia,serif;display:block;margin-bottom:6px}
.chart{width:100%;height:auto;display:block}.audio-link{display:inline-block;margin:6px 0}.pill{display:inline-block;padding:6px 11px;background:var(--sage);border-radius:999px;color:#475147}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekgrid button{padding:9px 2px;font-size:12px;border-radius:16px}.weekgrid button.has{background:var(--sage);border-color:var(--accent)}
@media(max-width:980px){
  .layout{grid-template-columns:1fr;gap:18px}
  aside{position:static;padding:14px 14px 10px;border-radius:26px}
  nav{flex-direction:row;overflow-x:auto;padding-bottom:6px;white-space:nowrap}
  nav button{flex-shrink:0}
  nav small{display:none}
}
@media(max-width:760px){
  .shell{padding:18px 16px 44px}
  header{padding:18px 18px 16px;border-radius:22px}
  .panel{padding:18px;border-radius:22px}
  .grid{gap:10px}
  .tile{padding:14px;min-height:108px;border-radius:18px}
  .logo{font-size:26px}
  .eyebrow{font-size:10px}
}
@media(max-width:520px){
  .grid,.metrics{grid-template-columns:1fr}
  .metric{padding:14px}
  .metric strong{font-size:28px}
  .history{font-size:12px}
}
@media print{body{background:white;color:black}.shell{display:none}#printReport{display:block;padding:0;font-size:11pt}#printReport h1{font-size:24pt}#printReport h2{font-size:16pt;margin-top:18px}#printReport p{white-space:pre-wrap;overflow-wrap:anywhere}#printReport section{break-inside:avoid}}

'use strict';const K='fieldnotes-practice-v1';let storageOK=true;let db={version:1,days:{},values:{},lang:'zh'};try{const raw=localStorage.getItem(K);if(raw){const x=JSON.parse(raw);if(x.version===1&&x.days&&x.values)db=x;}}catch(e){storageOK=false}let spanDays=7;let lang=db.lang==='en'?'en':'zh',page='home',day=localDate(),breathStep=0;const T=(z,e)=>lang==='zh'?z:e;const $=s=>document.querySelector(s);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const E=escapeHtml;function localDate(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function save(){try{localStorage.setItem(K,JSON.stringify(db));storageOK=true}catch(e){storageOK=false}const s=$('#status');if(s)s.textContent=storageOK?T('已保存在此浏览器','Saved on this browser'):T('保存失败，请导出备份','Save failed — export a backup')};function record(){return db.days[day]??{}};function read(path){let x=path[0]==='values'?db.values:record();for(const k of path.slice(1))x=x?.[k];return x??''}function set(path,v){let x;if(path[0]==='values')x=db.values;else{x=db.days[day]??(db.days[day]={})}for(const k of path.slice(1,-1))x=x[k]??(x[k]={});x[path.at(-1)]=v;save()};const pages=[['home','今日','Today'],['tracking','趋势','Tracking'],['diary','活动日记','Activity diary'],['cbt','CBT 五领域','CBT cycle'],['nat','自动思维','Automatic thoughts'],['rumination','反刍思维','Rumination'],['grounding','五感觉察','Grounding'],['breath','呼吸练习','Breathing'],['pmr','肌肉放松','Relaxation'],['sleep','睡眠','Sleep'],['values','个人价值观','Values'],['history','历史与导出','History & export'],['support','支持与帮助','Support']];const periods=[['morning','早晨','Morning'],['afternoon','下午','Afternoon'],['evening','晚上','Evening']];const cbt=[['situation','情境','Situation','何时、何地、和谁？发生了什么？','Where? When? Who with? What happened?'],['thought','思维或画面','Thoughts or images','当时脑海中有什么？它意味着什么？','What went through my mind? What did it mean?'],['body','身体 <div class="breath-toolbar"><button class="primary" type="button" id="startBreath">${T('开始练习','Start practice')}</button><button type="button" id="nextBreath">${T('手动下一步','Next edge')}</button><button type="button" id="resetBreath">${T('重置','Reset')}</button><label class="breath-pace" for="breathPace">${T('节奏','Pace')}<select id="breathPace"><option value="3,4">${T('轻柔 · 3 / 4 秒','Gentle · 3 / 4 s')}</option><option value="4,6">${T('舒缓 · 4 / 6 秒','Slow · 4 / 6 s')}</option><option value="2,3">${T('短一些 · 2 / 3 秒','Shorter · 2 / 3 s')}</option></select></label></div>
<div class="breath-caption"><span id="breathRounds">${T('已完成 0 次呼吸','0 breaths completed')}</span><span>${T('无屏息 · 自然呼吸，不必追赶节奏','No breath holds · follow a comfortable rhythm')}</span></div>${check(['day','breath','rectangle'],'今天练习过矩形呼吸','Practised rectangle breathing today')}`)+wrap(`<h2>${T('腹式呼吸','Belly breathing')}</h2><p>${T('找一个舒服的位置。双手放在腹部，缓慢吸气，想象腹部气球自然鼓起；呼气，气球缩小。重复 4–5 次，然后自然呼吸。','Find a comfortable position. Place both hands on your belly. Slowly breathe in, imagine a balloon gently expanding, then breathe out and let it deflate. Repeat 4–5 times, then breathe normally.')}</p>${check(['day','breath','belly'],'今天练习过腹式呼吸','Practised belly breathing today')}${field(['day','breath','note'],'练习后的感受（可选）','How did I feel afterwards (optional)?')}</section>`.replace(/<\/section>$/,''))+`<p class="muted">${T('如果头晕或不适，请停止并恢复正常呼吸。','If you feel dizzy or uncomfortable, stop and return to normal breathing.')}</p>`;break;
case 'values':h=title('个人价值观','Personal values','价值观是持续的方向，目标是沿途可以完成的事情。','Values are ongoing directions; goals are milestones along the way.')+`<div class="topline"><span class="muted">${T('这部分不按天填写。每月或治疗前回顾一次。','This is not a daily form. Revisit monthly or before therapy.')}</span><span id="status" class="status"></span></div>`+wrap(`<h2>${T('如果没有阻碍','If nothing were in your way')}</h2>${field(['values','reflection'],'我真正重视什么？','What truly matters to me?','例如：探索不同文化，保持好奇心。','For example: exploring cultures and staying curious.')}`)+domains.map(([k,z,e])=>wrap(`<h2>${T(z,e)}</h2>${field(['values',k,'direction'],'我希望怎样生活？','How do I want to live?') }<div class="grid"><div>${score(['values',k,'importance'],'重要程度','Importance')}</div><div>${score(['values',k,'success'],'过去一个月的实践程度','Lived this value in the past month')}</div></div>`)).join('')+`<button class="primary" id="printValues">${T('打印 / 保存价值观 PDF','Print / save values as PDF')}</button>`;break;
case 'history':{let dates=Object.keys(db.days).filter(d=>hasData(db.days[d])).sort().reverse();h=title('历史与导出','History & export','你的记录不会自动发送给治疗师。你可以自行决定分享哪些。','Your notes are not automatically sent to your therapist. You decide what to share.')+wrap(`<h2>${T('日常记录','Daily entries')}</h2>${dates.length?`<table class="history"><thead><tr><th>${T('日期','Date')}</th><th>${T('已记录内容','Practices')}</th><th></th></tr></thead><tbody>${dates.map(d=>`<tr><td>${E(d)}</td><td>${E(Object.keys(db.days[d]).filter(k=>hasData(db.days[d][k])).map(k=>({diary:T('活动','Diary'),cbt:'CBT',nat:T('思维','Thoughts'),breath:T('呼吸','Breathing'),rumination:T('反刍','Rumination'),grounding:T('觉察','Grounding'),pmr:T('放松','Relaxation'),sleep:T('睡眠','Sleep')}[k]||k)).join(' · '))}</td><td><button data-open="${E(d)}">${T('打开','Open')}</button> <button data-print="${E(d)}">${T('打印','Print')}</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">${T('还没有记录。','No entries yet.')}</div>`}`)+wrap(`<h2>${T('导出与备份','Export & backup')}</h2><p class="muted">${T('JSON 备份包含全部敏感记录，请存放在安全位置。清除浏览器数据或更换设备会导致本地记录丢失。','The JSON backup contains sensitive notes. Store it securely. Clearing browser data or changing devices can remove local records.')}</p><div class="row"><button class="primary" id="export">${T('导出 JSON','Export JSON')}</button><button id="import">${T('恢复备份','Restore backup')}</button><input type="file" id="backup" accept=".json,application/json" hidden><button id="printAll">${T('打印全部记录','Print all notes')}</button></div><div class="rule"></div><button class="danger" id="erase">${T('删除本地所有记录','Delete all local records')}</button>`);break}
case 'support':h=title('支持与帮助','Support','当你需要额外帮助时，不必依赖这个网站。','This website cannot monitor your wellbeing or provide emergency care.')+wrap(`<h2>${T('治疗预约','Therapy appointment')}</h2><p>${T('请使用治疗师邮件提供的原始视频预约链接。','Use the original video appointment link provided by your therapist.')}</p><h2>${T('英国紧急支持','Urgent support in the UK')}</h2><p>${T('心理健康恶化时，可联系 GP。需要紧急心理健康支持时，拨打 NHS 111，选择心理健康选项；如果存在即时危险，拨打 999。','If your mental health worsens, contact your GP. For urgent mental health support, call NHS 111 and select the mental health option; call 999 in immediate danger.')}</p><p>Samaritans: <a href="tel:116123">116 123</a><br>Shout: ${T('发送短信 SHOUT 至','Text SHOUT to')} 85258</p><p class="muted">${T('依据安全计划中的主要服务整理；本页面没有监控、报警或自动联系功能。','Based on the main services in the safety plan. This page has no monitoring, alerts or automatic contact functions.')}</p>`)+wrap(`<h2>${T('隐私','Privacy')}</h2><p>${T('本站无账户、无服务器、无分析脚本。记录仅保存在浏览器 localStorage 中，没有加密；能访问你的浏览器或设备的人可能读取它。GitHub Pages 的网页本身可能公开，不要提交个人记录或备份文件至仓库。','No account, backend or analytics. Notes are stored in browser localStorage, unencrypted; someone with access to your browser or device may read them. A GitHub Pages site may be public. Do not commit notes or backup files to the repository.')}</p>`);break;}if(['diary','cbt','nat','rumination','grounding','breath','pmr','sleep','values'].includes(page))h+=`<div class="save-dock"><div id="saveFeedback" class="save-feedback" role="status" aria-live="polite">${T('自动保存已开启 · 仅存于此设备','Autosave enabled · stored on this device')}</div><button type="button" class="primary" id="saveEntry">${T('保存记录','Save entry')}</button></div>`;$('#main').innerHTML=h;bind()};
function hasData(o){return typeof o==='object'&&o!==null?Object.values(o).some(hasData):o!==''&&o!==null&&o!==undefined&&o!==false}function bind(){const saveEntry=$('#saveEntry');if(saveEntry)saveEntry.onclick=()=>{document.querySelectorAll('[data-path]').forEach(el=>{const path=el.dataset.path.split('.');const val=el.type==='checkbox'?el.checked:el.value;const old=read(path);if(val!==old&&!(val===false&&old===''))set(path,val)});save();const feedback=$('#saveFeedback');feedback.dataset.error=String(!storageOK);feedback.textContent=storageOK?T('已保存至此浏览器 · ','Saved on this browser · ')+new Date().toLocaleTimeString(lang==='zh'?'zh-CN':'en-GB',{hour:'2-digit',minute:'2-digit'}):T('保存失败，请立即导出备份','Save failed — export a backup now');saveEntry.textContent=storageOK?T('✓ 已保存','✓ Saved'):T('重试保存','Retry save')};document.querySelectorAll('[data-path]').forEach(el=>{const reset=()=>{if(saveEntry){saveEntry.textContent=T('保存记录','Save entry');const feedback=$('#saveFeedback');feedback.dataset.error=String(!storageOK);feedback.textContent=storageOK?T('自动保存已开启 · 仅存于此设备','Autosave enabled · stored on this device'):T('保存失败，请导出备份','Save failed — export a backup')}};el.addEventListener('input',reset);el.addEventListener('change',reset)});document.querySelectorAll('[data-span]').forEach(b=>b.onclick=()=>{spanDays=Number(b.dataset.span);render()});if($('#printRange'))$('#printRange').onclick=()=>printReport(daysEnding(spanDays),true);document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#lang').onclick=()=>{lang=lang==='zh'?'en':'zh';db.lang=lang;save();render()};const d=$('#day');if(d)d.onchange=()=>{if(d.value){day=d.value;render()}};document.querySelectorAll('[data-path]').forEach(el=>{let event=el.tagName==='TEXTAREA'?'input':'change';el.addEventListener(event,()=>set(el.dataset.path.split('.'),el.type==='checkbox'?el.checked:el.value))});if($('#nextBreath')){const pace=$('#breathPace');pace.value=breathPace.join(',');pace.onchange=()=>{stopBreath();breathPace=pace.value.split(',').map(Number);breathStep=0;breathElapsed=0;breathRounds=0;updateBreath()};$('#startBreath').onclick=()=>{if(breathFrame!==null){stopBreath();return}breathLast=null;$('#startBreath').textContent=T('暂停','Pause');breathFrame=requestAnimationFrame(tickBreath)};$('#nextBreath').onclick=()=>{stopBreath();advanceBreath();updateBreath()};$('#resetBreath').onclick=()=>{stopBreath();breathStep=0;breathElapsed=0;breathRounds=0;updateBreath()};updateBreath()}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{day=b.dataset.open;go('diary')});document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printReport([b.dataset.print],false));if($('#printValues'))$('#printValues').onclick=()=>printReport([],true);if($('#printAll'))$('#printAll').onclick=()=>printReport(Object.keys(db.days).sort(),true);if($('#export'))$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='fieldnotes-backup-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('#import')){$('#import').onclick=()=>$('#backup').click();$('#backup').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const x=JSON.parse(await f.text());if(!valid(x))throw Error('invalid');if(confirm(T('恢复备份会替换当前记录，继续吗？','Restore will replace your current notes. Continue?'))){db=x;db.lang=lang;save();render()}}catch(e){alert(T('无法读取有效的 Fieldnotes 备份。','Unable to read a valid Fieldnotes backup.'))}}}if($('#erase'))$('#erase').onclick=()=>{if(confirm(T('永久删除此浏览器的所有记录？建议先备份。','Permanently delete all notes in this browser? Back up first.'))){db.days={};db.values={};save();render()}}}
function valid(x){const plain=o=>o&&typeof o==='object'&&!Array.isArray(o);function safe(o,depth=0){if(depth>8)return false;if(typeof o==='string'||typeof o==='boolean'||typeof o==='number'||o===null)return true;if(!plain(o))return false;return Object.entries(o).every(([k,v])=>!['__proto__','constructor','prototype'].includes(k)&&safe(v,depth+1))}return plain(x)&&x.version===1&&plain(x.days)&&plain(x.values)&&Object.keys(x.days).every(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&plain(x.days[k]))&&safe(x)}let breathFrame=null,breathLast=null,breathElapsed=0,breathRounds=0,breathPace=[3,4];
function stopBreath(update=true){if(breathFrame!==null)cancelAnimationFrame(breathFrame);breathFrame=null;breathLast=null;if(update&&$('#startBreath'))$('#startBreath').textContent=breathElapsed?T('继续练习','Resume practice'):T('开始练习','Start practice')}
function advanceBreath(){if(breathStep%2===1)breathRounds++;breathStep=(breathStep+1)%4;breathElapsed=0}
function tickBreath(now){if(page!=='breath'||!$('#breathBox')||document.hidden){stopBreath();return}if(breathLast!==null){breathElapsed+=Math.min(now-breathLast,100);let duration=breathPace[breathStep%2]*1000;if(breathElapsed>=duration){const remainder=breathElapsed-duration;advanceBreath();breathElapsed=remainder}}breathLast=now;updateBreath();breathFrame=requestAnimationFrame(tickBreath)}
function updateBreath(){const box=$('#breathBox');if(!box)return;const inhale=breathStep%2===0,duration=breathPace[breathStep%2],p=Math.max(0,Math.min(1,breathElapsed/(duration*1000))),points=[[20,200],[20,20],[340,20],[340,200]],a=points[breathStep],b=points[(breathStep+1)%4],x=a[0]+(b[0]-a[0])*p,y=a[1]+(b[1]-a[1])*p;box.dataset.step=breathStep;const word=T(inhale?'吸气':'呼气',inhale?'Breathe in':'Breathe out');if($('#breathWord').textContent!==word)$('#breathWord').textContent=word;$('#breathCount').textContent=Math.max(1,Math.ceil(duration-breathElapsed/1000))+' s';$('#breathHint').textContent=[T('左侧短边','Left short edge'),T('顶部长边','Top long edge'),T('右侧短边','Right short edge'),T('底部长边','Bottom long edge')][breathStep];$('#breathEdge').setAttribute('d','M'+a.join(' ')+' L'+b.join(' '));$('#breathTrail').setAttribute('d','M'+a.join(' ')+' L'+x+' '+y);const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;for(const id of ['#breathDot','#breathHalo']){$(id).setAttribute('cx',reduced?a[0]:x);$(id).setAttribute('cy',reduced?a[1]:y)}const scale=inhale?p:1-p;$('#breathAura').setAttribute('r',reduced?55:49+24*scale);$('#breathCore').setAttribute('r',reduced?43:43+12*scale);$('#breathRounds').textContent=T('已完成 '+breathRounds+' 次呼吸',breathRounds+' breaths completed')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopBreath()});
function line(label,v){return v!==undefined&&v!==null&&v!==''&&v!==false?`<p><strong>${E(label)}:</strong> ${E(v===true?'Yes':v)}</p>`:''}function printReport(dates,includeValues){let h='<h1>Fieldnotes — Practice notes</h1>';for(const date of dates){let r=db.days[date];if(!r||!hasData(r))continue;h+=`<h2>${E(date)}</h2>`;if(hasData(r.diary)){h+='<section><h3>Behavioural activation activity diary</h3>';for(const [k,,e] of periods){let a=r.diary?.[k];if(hasData(a))h+=`<p><strong>${e}</strong></p>`+line('Activity',a.activity)+line('Mood (0–10)',a.mood)}h+='</section>'}if(hasData(r.cbt)){h+='<section><h3>CBT cycle</h3>'+cbt.map(([k,,e])=>line(e,r.cbt[k])).join('')+line('Intensity (%)',r.cbt.intensity)+line('Small change',r.cbt.change)+'</section>'}if(hasData(r.nat)){h+='<section><h3>Automatic thoughts</h3>'+nat.map(([k,,e])=>line(e,r.nat[k])).join('')+'</section>'}if(hasData(r.breath)){h+='<section><h3>Breathing practice</h3>'+line('Rectangle',r.breath.rectangle)+line('Belly',r.breath.belly)+line('Reflection',r.breath.note)+'</section>'}for(const [k,fields] of Object.entries(extra)){if(!hasData(r[k]))continue;h+=`<section><h3>${E({rumination:'Managing rumination',grounding:'Grounding',pmr:'Relaxation log',sleep:'Sleep diary'}[k])}</h3>`;if(k==='grounding')h+=senses.map(([key,n,,en])=>line(n+' things: '+en,r[k][key])).join('');h+=fields.map(([key,,en])=>line(en,r[k][key])).join('')+'</section>'}}if(includeValues){h+='<h2>Identifying my values</h2>'+line('Reflection',db.values.reflection);for(const [k,,e] of domains){let a=db.values[k];if(hasData(a))h+=`<section><h3>${e}</h3>`+line('Valued direction',a.direction)+line('Importance (0–10)',a.importance)+line('Lived this value (0–10)',a.success)+'</section>'}}$('#printReport').innerHTML=h;window.print()};render();if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
